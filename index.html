<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMT Barcode Mapper</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #00adb5;
            --confirm-color: #393e46;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1, h2 { margin: 10px 0; text-align: center; font-size: 1.6rem; }
        .container { width: 100%; max-width: 500px; }
        
        /* Kontajner pre skener s červenou zameriavacou linkou */
        .scanner-wrapper {
            position: relative;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--accent-color);
            background: #000;
        }
        #reader {
            width: 100%;
        }
        /* Červená linka v strede pre ľahšie zameranie čiarového kódu */
        .laser-line {
            position: absolute;
            top: 50%;
            left: 5%;
            width: 90%;
            height: 2px;
            background-color: #ff4136;
            box-shadow: 0 0 8px #ff4136;
            z-index: 10;
            pointer-events: none;
        }
        
        .card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .scanned-text {
            word-break: break-all;
            font-family: monospace;
            background: #2d2d2d;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            text-align: center;
            color: #fff;
        }
        
        .found-info {
            background-color: #2a3a3a;
            border-left: 5px solid var(--accent-color);
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            text-align: center;
        }
        .found-location {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
            margin-top: 5px;
        }
        
        .machine-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .btn-machine {
            background-color: var(--confirm-color);
            color: white;
            border: 2px solid #4f5b66;
            padding: 18px 0;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-machine:active {
            background-color: var(--accent-color);
        }
        
        .position-input-zone {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .input-pos {
            flex: 1;
            background: #2d2d2d;
            border: 2px solid #4f5b66;
            color: white;
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 6px;
            text-align: center;
        }
        .input-pos:focus {
            border-color: var(--accent-color);
            outline: none;
        }
        .btn-save-pos {
            background-color: var(--accent-color);
            color: black;
            border: none;
            padding: 0 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
        }
        
        .history-list {
            margin-top: 20px;
            max-height: 220px;
            overflow-y: auto;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid #333;
            font-size: 0.9rem;
        }
        .machine-badge {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .btn-clear {
            background: #ff4136;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>SMT Barcode Mapper</h1>
    
    <div class="scanner-wrapper">
        <div id="reader"></div>
        <div class="laser-line"></div>
    </div>
    
    <div class="card" id="action-card" style="display: none;">
        <h3>Naskenovaný diel:</h3>
        <div class="scanned-text" id="result-text">---</div>
        
        <div id="search-result" style="display: none;"></div>
        
        <div id="step-machine">
            <h3 id="assignment-title">Priradiť k Fuji stroju (1-9):</h3>
            <div class="machine-grid" id="machine-buttons"></div>
        </div>
        
        <div id="step-position" style="display: none;">
            <h3>Zadaj pozíciu pre Stroj <span id="selected-machine-label" style="color:var(--accent-color)">-</span>:</h3>
            <div class="position-input-zone">
                <input type="number" id="input-position" class="input-pos" placeholder="Číslo pozície" inputmode="numeric" pattern="[0-9]*">
                <button class="btn-save-pos" onclick="saveFinalMapping()">Uložiť</button>
            </div>
        </div>
    </div>
    
    <div class="card">
        <h2>Uložené komponenty (<span id="count">0</span>)</h2>
        <div class="history-list" id="history-data"></div>
        <button class="btn-clear" onclick="clearAllData()">Vymazať celú referenciu</button>
    </div>
</div>

<script>
    let html5QrcodeScanner;
    let lastScannedCode = "";
    let temporaryMachine = null;
    let database = JSON.parse(localStorage.getItem('smt_barcode_mapping')) || {};

    function init() {
        renderHistory();
        renderButtons();
        
        // Zmena konfigurácie: pridali sme podporu pre klasické čiarové kódy (Code 128, Code 39, atď.)
        // Upravili sme qrbox na obdĺžnik (šírka 280, výška 120), aby lepšie sedel na čiarový kód
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 15, 
            qrbox: { width: 280, height: 120 },
            rememberLastUsedCamera: true,
            formatsToSupport: [ 
                Html5QrcodeSupportedFormats.QR_CODE,
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.EAN_13
            ],
            supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
        });
        
        html5QrcodeScanner.render(onScanSuccess);
        
        document.getElementById("input-position").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                saveFinalMapping();
            }
        });
    }

    function onScanSuccess(decodedText) {
        // Ignorujeme okamžité duplicitné načítanie rovnakého kódu počas zobrazeného výsledku
        if (decodedText === lastScannedCode && document.getElementById("action-card").style.display === "block") {
            return;
        }

        lastScannedCode = decodedText;
        document.getElementById("result-text").innerText = decodedText;
        document.getElementById("action-card").style.display = "block";
        
        const searchResultDiv = document.getElementById("search-result");
        
        if (database[decodedText]) {
            searchResultDiv.style.display = "block";
            searchResultDiv.innerHTML = `
                <div class="found-info">
                    Umiestnenie komponentu:
                    <div class="found-location">Stroj ${database[decodedText].machine} | Pozícia ${database[decodedText].position}</div>
                </div>
            `;
            document.getElementById("assignment-title").innerText = "Chceš zmeniť priradenie? Vyber stroj:";
        } else {
            searchResultDiv.style.display = "none";
            document.getElementById("assignment-title").innerText = "Priradiť k Fuji stroju (1-9):";
        }
        
        document.getElementById("step-machine").style.display = "block";
        document.getElementById("step-position").style.display = "none";
        document.getElementById("input-position").value = "";
        
        if (navigator.vibrate) navigator.vibrate(100);
    }

    function renderButtons() {
        const grid = document.getElementById("machine-buttons");
        grid.innerHTML = "";
        for (let i = 1; i <= 9; i++) {
            const btn = document.createElement("button");
            btn.className = "btn-machine";
            btn.innerText = i;
            btn.onclick = () => selectMachine(i);
            grid.appendChild(btn);
        }
    }

    function selectMachine(machineNum) {
        temporaryMachine = machineNum;
        document.getElementById("selected-machine-label").innerText = machineNum;
        document.getElementById("step-machine").style.display = "none";
        document.getElementById("step-position").style.display = "block";
        
        setTimeout(() => {
            document.getElementById("input-position").focus();
        }, 50);
    }

    function saveFinalMapping() {
        const posValue = document.getElementById("input-position").value.trim();
        if (!lastScannedCode || !temporaryMachine || !posValue) return;
        
        database[lastScannedCode] = {
            machine: temporaryMachine,
            position: posValue
        };
        
        localStorage.setItem('smt_barcode_mapping', JSON.stringify(database));
        renderHistory();
        
        document.getElementById("action-card").style.display = "none";
        lastScannedCode = "";
        temporaryMachine = null;
    }

    function renderHistory() {
        const listContainer = document.getElementById("history-data");
        listContainer.innerHTML = "";
        
        const keys = Object.keys(database);
        document.getElementById("count").innerText = keys.length;
        
        if (keys.length === 0) {
            listContainer.innerHTML = '<div style="text-align:center; color:#777; padding: 10px;">Žiadne priradené komponenty.</div>';
            return;
        }
        
        keys.reverse().forEach(code => {
            const item = document.createElement("div");
            item.className = "history-item";
            
            const shortCode = code.length > 22 ? code.substring(0, 19) + "..." : code;
            
            item.innerHTML = `
                <span title="${code}">${shortCode}</span>
                <span class="machine-badge">Stroj ${database[code].machine} (Poz. ${database[code].position})</span>
            `;
            listContainer.appendChild(item);
        });
    }

    function clearAllData() {
        if (confirm("Naozaj vymazať celú túto referenciu?")) {
            database = {};
            localStorage.removeItem('smt_barcode_mapping');
            renderHistory();
            document.getElementById("action-card").style.display = "none";
        }
    }

    window.onload = init;
</script>

</body>
</html>
