<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMT Component Mapper</title>
    <!-- Načítanie knižnice pre skenovanie QR kódov -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #00adb5;
            --confirm-color: #393e46;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1, h2 { margin: 10px 0; text-align: center; }
        .container { width: 100%; max-width: 500px; }
        
        /* Sekcia skenera */
        #reader {
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--accent-color);
        }
        
        /* Výsledky a interakcia */
        .card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .scanned-text {
            word-break: break-all;
            font-family: monospace;
            background: #2d2d2d;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        
        /* Mriežka tlačidiel pre stroje 1-9 */
        .machine-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .btn-machine {
            background-color: var(--confirm-color);
            color: white;
            border: 2px solid #4f5b66;
            padding: 20px 0;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-machine:active {
            background-color: var(--accent-color);
        }
        
        /* Zoznam uložených dát */
        .history-list {
            margin-top: 20px;
            max-height: 250px;
            overflow-y: auto;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid #333;
            font-size: 0.9rem;
        }
        .machine-badge {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .btn-clear {
            background: #ff4136;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>SMT QR Mapper</h1>
    
    <!-- Okno kamery -->
    <div id="reader"></div>
    
    <!-- Diagnostika / Aktuálny stav -->
    <div class="card" id="action-card" style="display: none;">
        <h3>Naskenovaný komponent:</h3>
        <div class="scanned-text" id="result-text">---</div>
        
        <h3 id="assignment-title">Priradiť k Fuji stroju (1-9):</h3>
        <div class="machine-grid" id="machine-buttons">
            <!-- Tlačidlá 1 až 9 vygeneruje JavaScript -->
        </div>
    </div>
    
    <!-- Prehľad už priradených komponentov -->
    <div class="card">
        <h2>Priradené komponenty (<span id="count">0</span>/50)</h2>
        <div class="history-list" id="history-data">
            <!-- Sem sa budú sypať priradené veci -->
        </div>
        <button class="btn-clear" onclick="clearAllData()">Vymazať celú referenciu</button>
    </div>
</div>

<script>
    let html5QrcodeScanner;
    let lastScannedCode = "";
    // Načítanie už uložených dát z pamäte mobilu
    let database = JSON.parse(localStorage.getItem('smt_mapping')) || {};

    function init() {
        renderHistory();
        renderButtons();
        
        // Nastavenie skenera. qrbox určuje veľkosť zameriavacieho štvorca
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 10, 
            qrbox: { width: 250, height: 250 },
            rememberLastUsedCamera: true,
            supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
        });
        
        html5QrcodeScanner.render(onScanSuccess);
    }

    // Spustí sa, keď kamera úspešne prečíta QR kód
    function onScanSuccess(decodedText) {
        lastScannedCode = decodedText;
        document.getElementById("result-text").innerText = decodedText;
        document.getElementById("action-card").style.display = "block";
        
        // Ak už tento komponent v databáze máme, zvýrazníme informáciu
        if (database[decodedText]) {
            document.getElementById("assignment-title").innerHTML = `⚠️ Už priradené k stroju <span style="color:#00adb5">${database[decodedText]}</span>. Zmeniť na:`;
        } else {
            document.getElementById("assignment-title").innerText = "Priradiť k Fuji stroju (1-9):";
        }
        
        // Krátke pípnutie/zavibrovanie (ak telefón podporuje)
        if (navigator.vibrate) navigator.vibrate(100);
    }

    // Vygenerovanie tlačidiel 1 až 9
    function renderButtons() {
        const grid = document.getElementById("machine-buttons");
        grid.innerHTML = "";
        for (let i = 1; i <= 9; i++) {
            const btn = document.createElement("button");
            btn.className = "btn-machine";
            btn.innerText = i;
            btn.onclick = () => assignMachine(i);
            grid.appendChild(btn);
        }
    }

    // Priradenie stroja ku kódu a zápis do LocalStorage
    function assignMachine(machineNum) {
        if (!lastScannedCode) return;
        
        database[lastScannedCode] = machineNum;
        localStorage.setItem('smt_mapping', JSON.stringify(database));
        
        renderHistory();
        
        // Skryjeme kartu akcie a pripravíme skener na ďalší kus
        document.getElementById("action-card").style.display = "none";
        lastScannedCode = "";
        document.getElementById("result-text").innerText = "---";
    }

    // Vykreslenie zoznamu priradených komponentov
    function renderHistory() {
        const listContainer = document.getElementById("history-data");
        listContainer.innerHTML = "";
        
        const keys = Object.keys(database);
        document.getElementById("count").innerText = keys.length;
        
        if (keys.length === 0) {
            listContainer.innerHTML = '<div style="text-align:center; color:#777; padding: 10px;">Zatiaľ žiadne priradené komponenty.</div>';
            return;
        }
        
        // Zobrazujeme od najnovšie priradených
        keys.reverse().forEach(code => {
            const item = document.createElement("div");
            item.className = "history-item";
            
            // Skrátenie pridlhého textu z QR kódu kvôli dizajnu na mobile
            const shortCode = code.length > 25 ? code.substring(0, 22) + "..." : code;
            
            item.innerHTML = `
                <span title="${code}">${shortCode}</span>
                <span class="machine-badge">Stroj ${database[code]}</span>
            `;
            listContainer.appendChild(item);
        });
    }

    // Reset celej referencie
    function clearAllData() {
        if (confirm("Naozaj vymazať všetky napárované komponenty pre túto referenciu?")) {
            database = {};
            localStorage.removeItem('smt_mapping');
            renderHistory();
            document.getElementById("action-card").style.display = "none";
        }
    }

    // Spustenie pri načítaní stránky
    window.onload = init;
</script>

</body>
</html>
